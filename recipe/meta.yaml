{% set version = "2.8.4.1" %}
{% set source_tag = "v2.8.4.1-cktile" %}
{% set torch_proc_type = "rocm" if hip_compiler_version != "None" else "cuda" %}

package:
  name: flash-attn-split
  # Strip ".postX" from version number because these just indicate wheel rebuilds and
  # are not relevant to conda builds
  version: {{ version.split('.')[:3] | join('.') }}

source:
  - url: https://github.com/ROCm/flash-attention/archive/refs/tags/{{ source_tag }}.tar.gz
    sha256: d32a2da527d76d16b734487c5112020a8be4036a02d84ba3c47f0b9d577dcd01

build:
  number: 4
  script: |
    {% if hip_compiler_version != "None" %}
    export USE_ROCM=1
    export USE_CUDA=0
    export ROCM_PATH="${BUILD_PREFIX}"
    export ROCM_HOME="${BUILD_PREFIX}"
    export HIP_PATH="${BUILD_PREFIX}"
    export HIP_ROOT_DIR="${BUILD_PREFIX}"
    if [[ -n "${ROCK_THE_CONDA_ROCM_GPU_TARGETS:-}" ]]; then
      export PYTORCH_ROCM_ARCH="${ROCK_THE_CONDA_ROCM_GPU_TARGETS}"
    fi
    {% endif %}
    {{ PYTHON }} -m pip install . -vvv --no-deps --no-build-isolation
  script_env:
    # Limit MAX_JOBS in order to prevent runners from crashing
    - MAX_JOBS=4
    - TORCH_CUDA_ARCH_LIST=8.0;8.6;8.9;9.0;10.0;12.0+PTX  # [cuda_compiler_version != "None"]
    - ROCK_THE_CONDA_ROCM_GPU_TARGETS                     # [hip_compiler_version != "None"]
  # Satisfy linter by not having duplicate skip keys
  skip: true  # [(hip_compiler_version == "None")]
  # debugging skips below
  # skip: true  # [py!=313]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}   # [cuda_compiler_version != "None"]
    - {{ compiler('hip') }}    # [hip_compiler_version != "None"]
    - {{ stdlib('c') }}
    - ninja
    - pytorch           # [build_platform != target_platform]
    - pytorch * {{ torch_proc_type }}*   # [build_platform != target_platform]
  host:
    - cuda-version {{ cuda_compiler_version }}  # [cuda_compiler_version != "None"]
    - cuda-cudart-dev                            # [cuda_compiler_version != "None"]
    - libcublas-dev                              # [cuda_compiler_version != "None"]
    - libcurand-dev                              # [cuda_compiler_version != "None"]
    - libcusolver-dev                            # [cuda_compiler_version != "None"]
    - libcusparse-dev                            # [cuda_compiler_version != "None"]
    - rocm-core {{ hip_compiler_version }}.*     # [hip_compiler_version != "None"]
    - pip
    - python
    - pytorch
    - pytorch * {{ torch_proc_type }}*
    - setuptools

outputs:
  - name: flash-attn
    requirements:
      build:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ compiler('cuda') }}   # [cuda_compiler_version != "None"]
        - {{ compiler('hip') }}    # [hip_compiler_version != "None"]
        - {{ stdlib('c') }}
      host:
        - cuda-version {{ cuda_compiler_version }}  # [cuda_compiler_version != "None"]
        - cuda-cudart-dev                            # [cuda_compiler_version != "None"]
        - rocm-core {{ hip_compiler_version }}.*     # [hip_compiler_version != "None"]
        - python
        - pytorch
        - pytorch * {{ torch_proc_type }}*
      run:
        - einops
        - python
        - pytorch * {{ torch_proc_type }}*

    files:
      include:
        - 'lib/python*/site-packages/flash_attn/**'
        - 'lib/python*/site-packages/flash_attn-{{ version }}.dist-info/**'
        - 'lib/python*/site-packages/flash_attn_2_cuda.cpython-*.so'

    test:
      imports:
        - flash_attn
      commands:
        - pip check
      requires:
        - pip

  - name: flash-attn-fused-dense
    requirements:
      build:
        - {{ compiler('cxx') }} # needed for DSO checker
        - {{ stdlib('c') }}     # needed for DSO checker
        - {{ compiler('cuda') }}   # [cuda_compiler_version != "None"]
        - {{ compiler('hip') }}    # [hip_compiler_version != "None"]
      host:
        - cuda-version {{ cuda_compiler_version }}  # [cuda_compiler_version != "None"]
        - cuda-cudart-dev                            # [cuda_compiler_version != "None"]
        - libcublas-dev                              # [cuda_compiler_version != "None"]
        - rocm-core {{ hip_compiler_version }}.*     # [hip_compiler_version != "None"]
        - python
        - pytorch
        - pytorch * {{ torch_proc_type }}*
      run:
        - python
        - {{ pin_subpackage('flash-attn', exact=True) }}

    files:
      include:
        - 'lib/python*/site-packages/fused_dense_lib.cpython-*.so'

    test:
      imports:
        - flash_attn.ops.fused_dense
      commands:
        - pip check
      requires:
        - pip

  - name: flash-attn-layer-norm
    requirements:
      build:
        - {{ compiler('cxx') }} # needed for DSO checker
        - {{ stdlib('c') }}     # needed for DSO checker
        - {{ compiler('cuda') }}   # [cuda_compiler_version != "None"]
        - {{ compiler('hip') }}    # [hip_compiler_version != "None"]
      host:
        - cuda-version {{ cuda_compiler_version }}  # [cuda_compiler_version != "None"]
        - cuda-cudart-dev                            # [cuda_compiler_version != "None"]
        - rocm-core {{ hip_compiler_version }}.*     # [hip_compiler_version != "None"]
        - python
        - pytorch
        - pytorch * {{ torch_proc_type }}*
      run:
        - python
        - {{ pin_subpackage('flash-attn', exact=True) }}

    files:
      include:
        - 'lib/python*/site-packages/dropout_layer_norm.cpython-*.so'

    test:
      imports:
        - flash_attn.ops.layer_norm
      commands:
        - pip check
      requires:
        - pip

about:
  home: https://github.com/Dao-AILab/flash-attention
  summary: 'Flash Attention: Fast and Memory-Efficient Exact Attention'
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - LICENSE_CUTLASS.txt

extra:
  feedstock-name: flash-attn
  recipe-maintainers:
    - carterbox
    - weiji14
